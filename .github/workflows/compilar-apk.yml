
name: Compilar APK Sistema de Riego

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compilar:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          echo "Configurando Android SDK..."

          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -z "$SDK_DIR" ]; then
            echo "Error: No se encontro Android SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Buscando sdkmanager..."
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "Error: sdkmanager no encontrado"
            exit 1
          fi

          echo "Usando: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK configurado correctamente"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar archivos
        shell: bash
        run: |
          echo "Archivos del proyecto:"
          ls -la

          echo "Archivos de Android:"
          ls -la app

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Archivos verificados correctamente"

      - name: Compilar APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SistemaDeRiego-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
